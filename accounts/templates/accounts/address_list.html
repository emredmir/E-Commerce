{% extends "accounts/profile.html" %}

{% block title %}XXX - Şifre Değiştir{% endblock %}

{% block main_content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<div class="container my-5">
    <h2>Adreslerim</h2>

    <!-- Yeni adres ekleme butonu -->
    <button id="addAddressBtn" class="btn btn-primary mb-3" data-url="{% url 'accounts:address_form' %}">
        + Yeni Adres Ekle
    </button>

    <!-- Adres listesi konteyneri -->
    <div id="addressListContainer">
        {% include 'accounts/address_list_partial.html' %}
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="addressModal" tabindex="-1" aria-labelledby="addressModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addressModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- AJAX ile içerik yüklenecek -->
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS (Modal ve diğer bileşenler için) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Sayfa içi JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    const modalEl = document.getElementById('addressModal');
    const modal = new bootstrap.Modal(modalEl);
    const modalTitle = document.getElementById('addressModalLabel');
    const modalBody = document.getElementById('modalBody');
    const addressListContainer = document.getElementById('addressListContainer');
    const addBtn = document.getElementById('addAddressBtn');

    // Yeni adres ekleme
    addBtn.addEventListener('click', () => {
        openModal(addBtn.dataset.url, 'Yeni Adres Ekle');
    });

    // Modal içeriğini AJAX ile yükle
    function openModal(url, title) {
        modalTitle.textContent = title;
        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(res => res.json())
            .then(data => {
                modalBody.innerHTML = data.form_html || data.confirm_html || '';
                modal.show();
                attachFormSubmitListener(); // form geldiğinde dinleyici bağla
            });
    }

    // Form gönderimini AJAX ile yap
    function attachFormSubmitListener() {
        const form = modalBody.querySelector('form');
        if (!form) return;

        form.addEventListener('submit', e => {
            e.preventDefault();
            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken'),
                },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    modal.hide();
                    refreshAddressList(); // listeyi yenile
                } else {
                    modalBody.innerHTML = data.form_html;
                    attachFormSubmitListener(); // hata varsa tekrar bağla
                }
            });
        });
    }

    // Sayfada düzenle ve sil butonlarını yeniden bağla
    function attachListeners() {
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                openModal(btn.dataset.url, 'Adresi Düzenle');
            });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                openModal(btn.dataset.url, 'Adres Silme Onayı');
            });
        });
    }

    // Listeyi AJAX ile yenile
    function refreshAddressList() {
        fetch("{% url 'accounts:address_list' %}", {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(res => res.json())
        .then(data => {
            addressListContainer.innerHTML = data.html;
            attachListeners();
        });
    }

    // Sayfa ilk yüklendiğinde eventleri bağla
    attachListeners();
});
</script>
{% endblock %}
