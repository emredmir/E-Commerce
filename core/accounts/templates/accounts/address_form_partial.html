<form method="post" action="{% if form.instance.pk %}{% url 'accounts:address_form_update' form.instance.pk %}{% else %}{% url 'accounts:address_form' %}{% endif %}">
    {% csrf_token %}
    {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
                <div class="text-danger">{{ error }}</div>
            {% endfor %}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Kaydet</button>
</form>
